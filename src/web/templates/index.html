<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Media Fetcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient-start: #f3e7e9; --bg-gradient-end: #e3eeff; --text-color: #111827;
            --card-bg: rgba(255, 255, 255, 0.8); --input-bg: #ffffff; --border-color: #e5e7eb;
            --primary-color: #3b82f6; --shadow-color: rgba(0, 0, 0, 0.1);
        }
        .dark {
            --bg-gradient-start: #1e293b; --bg-gradient-end: #111827; --text-color: #f9fafb;
            --card-bg: rgba(31, 41, 55, 0.8); --input-bg: #374151; --border-color: #4b5563;
            --primary-color: #60a5fa; --shadow-color: rgba(0, 0, 0, 0.3);
        }
        body { background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end)); color: var(--text-color); }
        .theme-card { background-color: var(--card-bg); border: 1px solid var(--border-color); backdrop-filter: blur(10px); box-shadow: 0 8px 32px 0 var(--shadow-color); }
        .theme-input, .theme-select { background-color: var(--input-bg); border-color: var(--border-color); }
        .theme-button { background-color: var(--primary-color); }
        .theme-button-danger { background-color: #ef4444; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans p-4">

    <div class="absolute top-4 right-4">
        <button id="theme-toggle" class="p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)]">
            <i class="fas fa-sun"></i><i class="fas fa-moon hidden"></i>
        </button>
    </div>

    <main class="w-full max-w-2xl mx-auto">
        <div class="theme-card rounded-xl shadow-lg p-6 md:p-10">
            <div class="text-center mb-8">
                <h1 class="text-3xl md:text-4xl font-bold">YouTube Media Fetcher</h1>
                <p class="text-gray-400 mt-2">Download videos and audio reliably from the cloud.</p>
            </div>

            <form id="download-form">
                <!-- URL Input -->
                <div class="relative mb-4">
                    <i class="fas fa-search absolute top-1/2 left-4 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="youtube-url" placeholder="Paste a YouTube URL..." class="theme-input w-full p-4 pl-12 rounded-lg border focus:ring-2 focus:ring-[var(--primary-color)] outline-none">
                </div>

                <!-- Preview Area -->
                <div id="preview-area" class="hidden text-center mb-4">
                    <img id="preview-img" src="" alt="Thumbnail" class="rounded-lg mx-auto shadow-md max-h-48">
                    <p id="preview-title" class="mt-2 font-semibold"></p>
                </div>

                <!-- Download Options -->
                <div id="options-area" class="hidden">
                    <div class="mb-4">
                        <label for="filename-input" class="block text-sm font-medium mb-1">Save As (Filename)</label>
                        <input type="text" id="filename-input" placeholder="Enter desired filename..." class="theme-input w-full p-3 rounded-lg border focus:ring-2 focus:ring-[var(--primary-color)] outline-none">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div>
                            <label for="format-select" class="block text-sm font-medium mb-1">Format</label>
                            <select id="format-select" class="theme-select w-full p-3 rounded-lg border focus:ring-2 focus:ring-[var(--primary-color)] outline-none">
                                <option value="mp4">MP4 (Video)</option>
                                <option value="mp3">MP3 (Audio)</option>
                                <option value="wav">WAV (Audio)</option>
                                <option value="m4a">M4A (Audio)</option>
                            </select>
                        </div>
                        <div>
                            <label for="quality-select" class="block text-sm font-medium mb-1">Quality</label>
                            <select id="quality-select" class="theme-select w-full p-3 rounded-lg border focus:ring-2 focus:ring-[var(--primary-color)] outline-none"></select>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div id="action-container">
                    <button type="submit" id="start-download-btn" class="theme-button text-white w-full py-3 rounded-lg font-semibold text-lg hover:opacity-90 transition transform hover:scale-105 flex items-center justify-center" disabled>
                        <i class="fas fa-download mr-2"></i>
                        <span id="btn-text">Download</span>
                    </button>
                </div>

                <!-- Progress/Status Area -->
                <div id="progress-container" class="hidden text-center mt-4">
                    <p id="status-text" class="mb-2"></p>
                    <div class="flex justify-center items-center">
                         <button id="cancel-btn" class="theme-button-danger text-white py-2 px-4 rounded-lg font-semibold hover:opacity-90 transition">
                            <i class="fas fa-times mr-2"></i>Cancel
                        </button>
                    </div>
                </div>

                 <!-- Final Download Link Area -->
                <div id="download-link-container" class="mt-4 text-center"></div>
            </form>
        </div>

        <!-- Alert/Notification Area -->
        <div id="alert-container" class="fixed top-5 right-5 z-50"></div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
