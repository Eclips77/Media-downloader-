<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Media Fetcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom styles for animations and theme */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        .fade-out { animation: fadeOut 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .slide-in { animation: slideIn 0.5s forwards; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Light & Dark theme custom properties */
        :root {
            --bg-color: #f9fafb;
            --text-color: #111827;
            --card-bg: #ffffff;
            --input-bg: #f3f4f6;
            --border-color: #e5e7eb;
            --primary-color: #3b82f6;
        }
        .dark {
            --bg-color: #111827;
            --text-color: #f9fafb;
            --card-bg: #1f2937;
            --input-bg: #374151;
            --border-color: #4b5563;
            --primary-color: #60a5fa;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        .theme-card {
            background-color: var(--card-bg);
            border-color: var(--border-color);
        }
        .theme-input {
            background-color: var(--input-bg);
            border-color: var(--border-color);
        }
        .theme-button {
            background-color: var(--primary-color);
        }
        .theme-toggle {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans p-4">

    <div class="absolute top-4 right-4">
        <button id="theme-toggle" class="theme-toggle p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--primary-color)]">
            <i class="fas fa-sun text-yellow-500"></i>
            <i class="fas fa-moon text-gray-400 hidden"></i>
        </button>
    </div>

    <main class="w-full max-w-2xl mx-auto">
        <div class="theme-card rounded-xl shadow-lg p-6 md:p-10 border">
            <div class="text-center mb-8">
                <h1 class="text-3xl md:text-4xl font-bold">YouTube Media Fetcher</h1>
                <p class="text-gray-400 mt-2">Download YouTube videos as MP3 or MP4 with ease.</p>
            </div>

            <!-- URL Input -->
            <form id="download-form">
                <div class="relative mb-4">
                    <input type="text" id="youtube-url" placeholder="Paste YouTube URL here..." class="theme-input w-full p-4 pr-12 rounded-lg border focus:ring-2 focus:ring-[var(--primary-color)] outline-none transition">
                </div>

                <!-- Thumbnail Preview -->
                <div id="thumbnail-preview" class="hidden text-center mb-4 slide-in">
                    <img id="thumbnail-img" src="" alt="Video Thumbnail" class="rounded-lg mx-auto shadow-md max-h-48">
                    <p id="video-title" class="mt-2 font-semibold"></p>
                </div>

                <!-- Format and Quality Selection -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div>
                        <label for="format-select" class="block text-sm font-medium mb-1">Format</label>
                        <select id="format-select" class="theme-input w-full p-2 rounded-lg border focus:ring-2 focus:ring-[var(--primary-color)] outline-none">
                            <option value="mp4">MP4</option>
                            <option value="mp3">MP3</option>
                        </select>
                    </div>
                    <div id="quality-container">
                        <label for="quality-select" class="block text-sm font-medium mb-1">Quality</label>
                        <select id="quality-select" class="theme-input w-full p-2 rounded-lg border focus:ring-2 focus:ring-[var(--primary-color)] outline-none">
                            <!-- Options will be populated by JS -->
                        </select>
                    </div>
                </div>

                <!-- Download Button -->
                <button type="submit" id="download-btn" class="theme-button text-white w-full py-3 rounded-lg font-semibold text-lg hover:opacity-90 transition-all duration-300 transform hover:scale-105 flex items-center justify-center">
                    <i class="fas fa-download mr-2"></i>
                    <span id="btn-text">Download</span>
                    <div id="loader" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-white ml-2"></div>
                </button>
            </form>
        </div>

        <!-- Alert/Notification Area -->
        <div id="alert-container" class="fixed top-5 right-5 z-50"></div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
